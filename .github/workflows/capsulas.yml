name: capsulas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capsulas:
    # Anclado, no `ubuntu-latest`: la etiqueta migra y una compuerta no debe
    # cambiar de suelo sin que alguien lo decida.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: version de python
        run: python3 --version

      # El self-test tambien necesita lector: falsa la pareja, la frontera, el alcance de su foto,
      # el entorno de las tres puertas, el vocabulario, el reloj, el censo de los diez brazos, la
      # conducta que cada uno publica, la admision que decide que poblacion se cuenta y lo que este
      # README publica. Si alguien
      # borra un cotejo, este paso se pone rojo antes de que el gate grande siga dando verde sobre
      # las declaraciones.
      - name: la pareja, la frontera, su alcance, el entorno, el vocabulario, el reloj, el censo, la conducta, la admision y lo publicado de los diez brazos se falsan a si mismos
        run: ./verificar-capsulas.sh --self-test

      - name: cada capsula explota en el vulnerable y se cierra en el parche
        run: ./verificar-capsulas.sh
